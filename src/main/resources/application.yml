server:
  port: 8080

spring:
  application:
    name: Gateway-APIs
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: microservicetwo-route
          uri: lb://MICROSERVICETWO
          predicates:
            - Path=/api/microservice2/**
        - id: microservicethree-route
          uri: lb://MICROSEVICETHREE
          predicates:
            - Path=/api/microservice3/**
        - id: microservicewithfiegn-route
          uri: lb://MICROSERVICEWITHFEIGN
          predicates:
            - Path=/api/fiegn/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  tracing:
    sampling:
      probability: 1.0   # 1.0 means record 100% of requests
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
